name: CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "CI OK"
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Swift Build
        run: swift build -v

      - name: Swift Test
        run: swift test -v

      - name: Build App Bundle
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh release
